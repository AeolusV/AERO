<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Codex Micro</title>
  <desc id="description">A light cloud-white squircle with a thin titanium Codex arc and a sky-blue status lens.</desc>
  <defs>
    <linearGradient id="shell" x1="154" y1="104" x2="850" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".42" stop-color="#F5F9FD"/>
      <stop offset="1" stop-color="#E5EDF6"/>
    </linearGradient>
    <linearGradient id="rim" x1="174" y1="124" x2="832" y2="912" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#C9D4DF"/>
      <stop offset="1" stop-color="#AEBBC9"/>
    </linearGradient>
    <linearGradient id="arc" x1="322" y1="250" x2="690" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D7B89"/>
      <stop offset=".5" stop-color="#455362"/>
      <stop offset="1" stop-color="#293542"/>
    </linearGradient>
    <radialGradient id="lens" cx="0" cy="0" r="1" gradientTransform="translate(716 492) rotate(90) scale(104)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8E9FF"/>
      <stop offset=".34" stop-color="#A5CEFF"/>
      <stop offset=".72" stop-color="#6CA8F5"/>
      <stop offset="1" stop-color="#4B86D6"/>
    </radialGradient>
    <filter id="shellShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#62758A" flood-opacity=".16"/>
    </filter>
    <filter id="lensGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6CA8F5" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="264" fill="url(#shell)" filter="url(#shellShadow)"/>
  <rect x="83" y="83" width="858" height="858" rx="253" fill="none" stroke="url(#rim)" stroke-width="18"/>
  <path d="M169 337C224 198 350 128 512 128c164 0 292 73 348 211" fill="none" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="14" stroke-linecap="round"/>
  <path d="M673 304A276 276 0 1 0 673 720" fill="none" stroke="url(#arc)" stroke-width="64" stroke-linecap="round"/>
  <circle cx="722" cy="512" r="61" fill="url(#lens)" filter="url(#lensGlow)"/>
  <ellipse cx="704" cy="490" rx="26" ry="15" fill="#FFFFFF" fill-opacity=".72" transform="rotate(-22 704 490)"/>
  <circle cx="722" cy="512" r="59" fill="none" stroke="#FFFFFF" stroke-opacity=".62" stroke-width="6"/>
</svg>
